# Postgres cho máy dev: npm run db:up (cần Docker Desktop đang chạy).
# Khớp DATABASE_URL mặc định trong .env.example.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "5432:5432"
    volumes:
      - arena-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      retries: 10

volumes:
  arena-db:
